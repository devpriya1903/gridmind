$kind: http-request
name: POST /devices — Create
description: |-
  DevicesController.create → DevicesService.create.

  `type` must be one of: smart_meter, smart_breaker, ev_charger, hvac,
  solar_inverter, battery, smart_plug (CreateDeviceDto @IsIn). Unknown
  type → **400**. Duplicate `name` → **409**.

  `name` is typed in this body and can differ per device type (for example
  `Meter-A` with `smart_meter`). It is not a collection variable. After 201,
  scripts POST the same name again (409) and POST type `inverter` (400).
method: POST
url: "{{baseUrl}}/devices"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Meter-A",
      "type": "smart_meter"
    }
scripts:
  - type: afterResponse
    code: |-
      const sent = JSON.parse(pm.request.body.raw);
      const baseUrl = pm.variables.get('baseUrl');

      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Returns a device row', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        pm.expect(body.name).to.eql(sent.name);
        pm.expect(body.type).to.eql(sent.type);
        pm.expect(body.status).to.eql('offline');
        pm.collectionVariables.set('deviceId', body.id);
      });

      if (pm.response.code === 201) {
        pm.sendRequest(
          {
            url: baseUrl + '/devices',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: {
              mode: 'raw',
              raw: JSON.stringify({ name: sent.name, type: sent.type }),
            },
          },
          function (err, res) {
            pm.test('Duplicate name returns 409', function () {
              pm.expect(err).to.equal(null);
              pm.expect(res.code).to.eql(409);
              pm.expect(JSON.stringify(res.json())).to.include(sent.name);
            });
          },
        );

        pm.sendRequest(
          {
            url: baseUrl + '/devices',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: {
              mode: 'raw',
              raw: JSON.stringify({
                name: 'Bad-Type-' + Date.now(),
                type: 'inverter',
              }),
            },
          },
          function (err, res) {
            pm.test('Unknown type inverter returns 400', function () {
              pm.expect(err).to.equal(null);
              pm.expect(res.code).to.eql(400);
            });
          },
        );
      }
    language: text/javascript
examples: .resources/POST -devices — Create.resources/examples
order: 2000
