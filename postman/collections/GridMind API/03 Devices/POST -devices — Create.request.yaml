$kind: http-request
name: POST /devices — Create
description: |-
  DevicesController.create → DevicesService.create.

  `type` must be one of: smart_meter, smart_breaker, ev_charger, hvac,
  solar_inverter, battery, smart_plug (CreateDeviceDto @IsIn). Unknown
  type → **400**. Duplicate `name` → **409**.

  Pre-request sets a unique `deviceName`. After 201, scripts POST the
  same name again (409) and POST type `inverter` (400). No extra requests.
method: POST
url: "{{baseUrl}}/devices"
examples: .resources/POST Create device.resources/examples
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{deviceName}}",
      "type": "smart_meter"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('deviceName', 'Inverter-' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      const deviceName = pm.collectionVariables.get('deviceName');
      const baseUrl = pm.variables.get('baseUrl');

      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Returns a device row', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        pm.expect(body.name).to.eql(deviceName);
        pm.expect(body.type).to.eql('smart_meter');
        pm.expect(body.status).to.eql('offline');
        pm.collectionVariables.set('deviceId', body.id);
      });

      if (pm.response.code === 201) {
        pm.sendRequest(
          {
            url: baseUrl + '/devices',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: {
              mode: 'raw',
              raw: JSON.stringify({ name: deviceName, type: 'smart_meter' }),
            },
          },
          function (err, res) {
            pm.test('Duplicate name returns 409', function () {
              pm.expect(err).to.equal(null);
              pm.expect(res.code).to.eql(409);
              pm.expect(JSON.stringify(res.json())).to.include(deviceName);
            });
          },
        );

        pm.sendRequest(
          {
            url: baseUrl + '/devices',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: {
              mode: 'raw',
              raw: JSON.stringify({
                name: 'Bad-Type-' + Date.now(),
                type: 'inverter',
              }),
            },
          },
          function (err, res) {
            pm.test('Unknown type inverter returns 400', function () {
              pm.expect(err).to.equal(null);
              pm.expect(res.code).to.eql(400);
            });
          },
        );
      }
    language: text/javascript
