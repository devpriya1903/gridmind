$kind: http-request
name: GET /devices — List
description: |-
  DevicesController.findAll → DevicesService.findAll.

  Expect **200** array, newest `createdAt` first.
url: "{{baseUrl}}/devices"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Body is a JSON array', function () {
        const body = pm.response.json();
        pm.expect(body).to.be.an('array');
      });
    language: text/javascript
examples: ./.resources/GET -devices — List.resources/examples
order: 1000
