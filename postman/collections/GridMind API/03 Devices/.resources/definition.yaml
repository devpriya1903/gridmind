$kind: collection
description: |-
  Device registry (Prisma `Device`). Needs Postgres + applied migrations.

  POST body (CreateDeviceDto):
  - `name` (string, required, trimmed) — unique in the database
  - `type` (required slug): `smart_meter` | `smart_breaker` | `ev_charger` |
    `hvac` | `solar_inverter` | `battery` | `smart_plug`
  - `status` (optional: `online` | `offline` | `fault`; default `offline`)

  Extra JSON keys → **400**. Unknown `type` (e.g. `inverter`) → **400**.
  Duplicate `name` → **409**. List is newest `createdAt` first.
order: 3000
