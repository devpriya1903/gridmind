$kind: http-example
name: POST /devices — Create
description: |-
  DevicesController.create → DevicesService.create.

  `name` is typed in the body and can differ per device type. The
  after-response script then POSTs the **same name again** and expects
  **409** (Prisma P2002). No separate duplicate request.

  Optional `status` omitted → Prisma default `offline`.
request:
  url: "{{baseUrl}}/devices"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "name": "Meter-A",
        "type": "smart_meter"
      }
response:
  statusCode: 201
  statusText: Created
