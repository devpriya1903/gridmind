$kind: http-request
name: 'POST /devices — Duplicate name (409)'
description: |-
  Same unique `name` as the database constraint `Device_name_key`.
  Prisma P2002 is mapped to HTTP **409** with
  `A device named "…" already exists`.

  First Send creates the fixture if it is missing (201). Second Send is the
  assertion you care about (**409**). Tests accept either so Collection Run
  does not flake on a clean database.
method: POST
url: '{{baseUrl}}/devices'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman-Duplicate-Fixture",
      "type": "inverter"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 on first create, 409 on duplicate', function () {
        pm.expect([201, 409]).to.include(pm.response.code);
      });
      if (pm.response.code === 409) {
        pm.test('Conflict message names the device', function () {
          const body = pm.response.json();
          pm.expect(JSON.stringify(body)).to.include('Postman-Duplicate-Fixture');
        });
      }
