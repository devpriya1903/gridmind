$kind: http-request
name: 'POST /devices — Create'
description: |-
  DevicesController.create → DevicesService.create.

  `name` is set in a pre-request script (`deviceName` + timestamp) so Send
  can be clicked repeatedly without hitting the unique-name **409**.

  Optional `status` omitted → Prisma default `offline`.

  Expect **201** JSON row: `id` (uuid), `name`, `type`, `status`, timestamps.
method: POST
url: '{{baseUrl}}/devices'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "{{deviceName}}",
      "type": "inverter"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('deviceName', 'Inverter-' + Date.now());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Returns a device row', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        pm.expect(body.name).to.eql(pm.collectionVariables.get('deviceName'));
        pm.expect(body.type).to.eql('inverter');
        pm.expect(body.status).to.eql('offline');
      });
