$kind: http-request
name: 'GET /devices — List'
description: |-
  DevicesController.findAll → prisma.device.findMany ordered by createdAt desc.

  Expect **200** JSON array. Empty `[]` is valid when no rows exist.
method: GET
url: '{{baseUrl}}/devices'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Body is a JSON array', function () {
        const body = pm.response.json();
        pm.expect(body).to.be.an('array');
      });
