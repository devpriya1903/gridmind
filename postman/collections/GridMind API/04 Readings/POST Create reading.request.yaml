$kind: http-request
name: 'POST /devices/:deviceId/readings — Create'
description: |-
  ReadingsController.create → ReadingsService.create.

  Needs `deviceId` from POST Create device. Main Send is **201**.
  The after-response script POSTs the same body to a UUID that is not
  in Device and expects **404**. No separate missing-device request.

  Reading `id` is this sample's PK; `deviceId` is the FK (they differ).
method: POST
url: '{{baseUrl}}/devices/{{deviceId}}/readings'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "metric": "power_kw",
      "value": 12.5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const baseUrl = pm.variables.get('baseUrl');
      const missingId = '00000000-0000-4000-8000-000000000000';

      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Returns a reading row', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        pm.expect(body.deviceId).to.eql(pm.collectionVariables.get('deviceId'));
        pm.expect(body.metric).to.eql('power_kw');
        pm.expect(body.value).to.eql(12.5);
      });

      if (pm.response.code === 201) {
        pm.sendRequest(
          {
            url: baseUrl + '/devices/' + missingId + '/readings',
            method: 'POST',
            header: { 'Content-Type': 'application/json' },
            body: {
              mode: 'raw',
              raw: JSON.stringify({ metric: 'power_kw', value: 1 }),
            },
          },
          function (err, res) {
            pm.test('Missing device returns 404', function () {
              pm.expect(err).to.equal(null);
              pm.expect(res.code).to.eql(404);
            });
          },
        );
      }
