$kind: http-request
name: 'POST /devices/:deviceId/readings — Create'
description: |-
  ReadingsController.create → ReadingsService.create.

  Needs `deviceId` from POST Create device. Stores one telemetry row
  (`metric` + `value`) belonging to that device.

  Expect **201** JSON: `id`, `deviceId`, `metric`, `value`, `recordedAt`, `createdAt`.
method: POST
url: '{{baseUrl}}/devices/{{deviceId}}/readings'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "metric": "power_kw",
      "value": 12.5
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      pm.test('Returns a reading row', function () {
        const body = pm.response.json();
        pm.expect(body.id).to.be.a('string').and.not.empty;
        pm.expect(body.deviceId).to.eql(pm.collectionVariables.get('deviceId'));
        pm.expect(body.metric).to.eql('power_kw');
        pm.expect(body.value).to.eql(12.5);
      });
