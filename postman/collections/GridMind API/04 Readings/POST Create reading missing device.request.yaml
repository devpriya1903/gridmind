$kind: http-request
name: 'POST /devices/:deviceId/readings — Missing device (404)'
description: |-
  Valid UUID that is not in Device. ReadingsService throws NotFoundException.
  Expect **404** `Device … not found`.
method: POST
url: '{{baseUrl}}/devices/00000000-0000-4000-8000-000000000000/readings'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "metric": "power_kw",
      "value": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', function () {
        pm.response.to.have.status(404);
      });
