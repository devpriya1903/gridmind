$kind: http-request
name: GET /devices/:deviceId/readings — List
url: "{{baseUrl}}/devices/{{deviceId}}/readings"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Body is a JSON array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });
    language: text/javascript
examples: ./.resources/GET -devices-deviceId-readings — List.resources/examples
