$kind: http-request
name: GET /devices/:deviceId/readings — List
description: |-
  ReadingsController.findAll → ReadingsService.findAllForDevice.

  Optional query (ListReadingsQueryDto): `metric`, `from`, `to` (ISO-8601).
  Omitted query lists all readings. Bad `from`/`to` → **400** (sendRequest).
  Missing device → **404** (sendRequest). Newest `recordedAt` first.
method: GET
url: "{{baseUrl}}/devices/{{deviceId}}/readings?from=2026-11-14T17:08:01.910Z"
queryParams:
  - key: metric
    value: power_kw
    disabled: true
  - key: from
    value: 2026-11-14T17:08:01.910Z
  - key: to
    value: 2026-11-14T18:08:01.910Z
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      const baseUrl = pm.variables.get('baseUrl');
      const missingId = '00000000-0000-4000-8000-000000000000';

      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Body is a JSON array', function () {
        pm.expect(pm.response.json()).to.be.an('array');
      });

      if (pm.response.code === 200) {
        pm.sendRequest(
          {
            url: baseUrl + '/devices/' + missingId + '/readings',
            method: 'GET',
          },
          function (err, res) {
            pm.test('Missing device returns 404', function () {
              pm.expect(err).to.equal(null);
              pm.expect(res.code).to.eql(404);
            });
          },
        );
        pm.sendRequest(
          {
            url:
              baseUrl +
              '/devices/' +
              pm.collectionVariables.get('deviceId') +
              '/readings?from=not-a-date',
            method: 'GET',
          },
          function (err, res) {
            pm.test('Invalid from query returns 400', function () {
              pm.expect(err).to.equal(null);
              pm.expect(res.code).to.eql(400);
            });
          },
        );
      }
    language: text/javascript
examples: ./.resources/GET -devices-deviceId-readings — List.resources/examples
order: 1000
