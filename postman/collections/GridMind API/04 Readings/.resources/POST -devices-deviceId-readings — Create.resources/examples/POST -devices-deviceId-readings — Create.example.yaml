$kind: http-example
name: POST /devices/:deviceId/readings — Create
description: >-
  ReadingsController.create → ReadingsService.create.


  Needs `deviceId` from POST Create device.

  Body is CreateReadingDto: `metric` (required), `value` (number, required),

  optional `recordedAt` (ISO-8601). Extra keys → **400**. Missing device →
  **404**.
request:
  url: "{{baseUrl}}/devices/{{deviceId}}/readings"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "metric": "power_kw",
        "value": 12.5
      }
