$kind: http-request
name: 'GET /devices/:deviceId/readings — List'
description: |-
  ReadingsController.findAll → ReadingsService.findAllForDevice.

  Needs collection variable `deviceId` (set by POST Create device).
  Expect **200** JSON array. Empty `[]` is valid. Unknown device → **404**.
method: GET
url: '{{baseUrl}}/devices/{{deviceId}}/readings'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200 or 404', function () {
        pm.expect([200, 404]).to.include(pm.response.code);
      });
      if (pm.response.code === 200) {
        pm.test('Body is a JSON array', function () {
          pm.expect(pm.response.json()).to.be.an('array');
        });
      }
