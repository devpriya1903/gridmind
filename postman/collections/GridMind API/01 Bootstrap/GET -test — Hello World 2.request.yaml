$kind: http-request
name: GET /test — Hello World 2
url: "{{baseUrl}}/test"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Body is Hello World 2!', function () {
        pm.expect(pm.response.text()).to.eql('Hello World 2!');
      });
    language: text/javascript
settings: {}
order: 2000
