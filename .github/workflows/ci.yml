# Required GitHub Actions job name for branch protection: "CI"
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma CLI reads DATABASE_URL even for `validate`. No real DB in this job.
      DATABASE_URL: postgresql://gridmind:gridmind@localhost:5432/gridmind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
